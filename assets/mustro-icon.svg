<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#142136"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#04060E"/>
    </radialGradient>

    <!-- Glassmorphic Rim -->
    <linearGradient id="iconRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Prompt Chevron Gradient -->
    <linearGradient id="iconLeftGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Vector 'M' Wordmark Gradient (Titanium White -> Sky Blue -> Soft Indigo) -->
    <linearGradient id="iconWordGrad" x1="206" y1="298" x2="366" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Clean Bloom Filter (Wide X bounds so narrow cursor glow never clips) -->
    <filter id="iconBloom" x="-150%" y="-40%" width="400%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="14" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- 1. Outer Framed Squircle App Icon -->
  <rect x="23" y="23" width="466" height="466" rx="109" fill="none" stroke="#334155" stroke-width="1" opacity="0.6"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#iconBg)" filter="url(#iconShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#iconRim)" stroke-width="2.5"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>

  <!-- 2. Mini Terminal Header Bar -->
  <path d="M 42 112 H 470" stroke="#1B293B" stroke-width="2.5"/>
  <circle cx="104" cy="74" r="9" fill="#22C55E"/>
  <circle cx="136" cy="74" r="9" fill="#F59E0B"/>
  <circle cx="168" cy="74" r="9" fill="#38BDF8"/>

  <!-- 3. Centered Terminal Prompt + Vector M + Cursor (L/R Margins ~90px, Gaps 22px, Center Y=298) -->
  <!-- Prompt Chevron '>' -->
  <path d="M 104 246 L 170 298 L 104 350" fill="none" stroke="url(#iconLeftGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vector Letter 'M' -->
  <path d="M 220 350 V 246 L 286 310 L 352 246 V 350" fill="none" stroke="url(#iconWordGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Active Running Terminal Cursor Block (#22C55E) -->
  <rect x="388" y="232" width="32" height="132" rx="9" fill="#22C55E" filter="url(#iconBloom)"/>
</svg>
