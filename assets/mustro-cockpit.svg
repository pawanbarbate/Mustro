<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" fill="none">
  <defs>
    <!-- Midnight Slate Canvas & Surface Gradient -->
    <linearGradient id="term-bg" x1="0" y1="0" x2="640" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Subtle Luminous Sheen for Prompt '>' & Vector 'M' -->
    <linearGradient id="prompt-m-grad" x1="106" y1="84" x2="226" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Wordmark Gradient: Titanium White -> Sky Blue -> Soft Indigo (Spans exact USTRO width) -->
    <linearGradient id="mustro-word-grad" x1="246" y1="108" x2="484" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Controlled Cursor Glow (theme.colors.running #22C55E) -->
    <filter id="cursor-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Window Background & Crisp Midnight Slate Border -->
  <rect x="4" y="4" width="632" height="172" rx="22" fill="url(#term-bg)" stroke="#25344A" stroke-width="2" />
  <!-- Subtle Inner Specular Hairline -->
  <rect x="5.5" y="5.5" width="629" height="169" rx="20.5" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />

  <!-- Window Header Divider -->
  <path d="M5 42H635" stroke="#1B293B" stroke-width="1.5" />

  <!-- Traffic Light Status Dots (Exact Midnight Slate Status Tokens) -->
  <circle cx="28" cy="23" r="5" fill="#22C55E" />
  <circle cx="46" cy="23" r="5" fill="#F59E0B" />
  <circle cx="64" cy="23" r="5" fill="#38BDF8" />

  <!-- Window Title -->
  <text x="612" y="27" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5">
    cockpit — zsh
  </text>

  <!-- Symmetrically Centered Prompt + Wordmark + Cursor (Left/Right margins ~102px) -->
  <!-- Prompt Chevron '>' -->
  <path d="M108 89L138 110L108 131" stroke="url(#prompt-m-grad)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Vector Letter 'M' (26px gap from '>', flush cap-height & baseline with USTRO) -->
  <path d="M170 131V89L198 116L226 89V131" stroke="url(#prompt-m-grad)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Wordmark 'USTRO' (~13px optical kerning from 'M', matching U-S-T-R-O) -->
  <text x="245" y="136" fill="url(#mustro-word-grad)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="72" font-weight="800" letter-spacing="4">
    USTRO
  </text>

  <!-- Active Running Cursor Block (26px gap from 'O', matching '>' to 'M') -->
  <rect x="510" y="84" width="22" height="52" rx="4" fill="#22C55E" filter="url(#cursor-glow)" />
</svg>
